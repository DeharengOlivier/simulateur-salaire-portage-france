name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.24'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov-report=xml
      - run: uv run coverage report --include=portage/model.py,portage/money.py --fail-under=100
      - name: Changed-code coverage
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch origin/main --fail-under=90
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o /tmp/portage-requirements.txt
          uv run pip-audit --disable-pip --no-deps -r /tmp/portage-requirements.txt
      - name: Build and smoke test the wheel
        run: |
          uv build --no-build-isolation
          uv venv /tmp/portage-wheel
          uv pip install --python /tmp/portage-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/portage-wheel/bin/portage bulletin --brut 3000 --cotisations 630 --csg-non-deductible 85.50 --pas 130 --net-attendu 2240
      - name: Scan full history for secrets
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/portage-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/portage-gitleaks gitleaks
          /tmp/portage-gitleaks/gitleaks git --redact --log-opts='--all' .
